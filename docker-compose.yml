services:

  # ── Infrastructure ─────────────────────────────────────────────────────────────

  database:
    image: postgres:18-alpine
    container_name: database
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend services ───────────────────────────────────────────────────────────

  api:
    build:
      context: .                           # monorepo root — Docker sees the whole repo
      dockerfile: packages/api/Dockerfile
    container_name: api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - '3000:3000'
    depends_on:
      database:
        condition: service_healthy         # waits until postgres is accepting connections

  users:
    build:
      context: .
      dockerfile: packages/users/Dockerfile
    container_name: users
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - '3001:3000'
    depends_on:
      database:
        condition: service_healthy

  auth:
    build:
      context: .
      dockerfile: packages/auth/Dockerfile
    container_name: auth
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - '3002:3000'
    depends_on:
      database:
        condition: service_healthy

  # ── Frontend ───────────────────────────────────────────────────────────────────

  web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile
    container_name: web
    restart: unless-stopped
    ports:
      - '80:80'

volumes:
  postgres_data:
